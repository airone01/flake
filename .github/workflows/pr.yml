name: PR

on:
  pull_request:

jobs:
  gen-matrix:
    name: Discover Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: airone01
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - id: set-matrix
        name: Discover Targets
        run: |
          set -Eeu
          matrix="$(nix run '.#lstr' -- diff-available-targets $BASE_SHA $HEAD_SHA -- . | jq -c '{include:([(.nixosConfigurations[]? | {type: "nixosConfigurations", target: ., os: "ubuntu-latest"}), (.packages // {} | to_entries[] | .key as $system | .value[] | {type: "packages", target: ., system: $system, os: "ubuntu-latest"})])}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  eval-targets:
    name: Eval / ${{ matrix.target }}${{ matrix.system && format(' / {0}', matrix.system) || '' }}
    needs: gen-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{fromJSON(needs.gen-matrix.outputs.matrix)}}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: airone01
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Evaluate and Diff Target
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          rc=0
          nix run '.#lstr' -- diff-target '${{ matrix.type }}' '${{ matrix.target }}' $BASE_SHA $HEAD_SHA -- . || rc=$?
          case "$rc" in
            0)
              needs_rebuild=false
              ;;
            101)
              needs_rebuild=true
              ;;
            *)
              echo "Unexpectde exit code $rc"
              exit "$rc"
              ;;
          esac
          mkdir -p target-status
          jq -nc \
            --argjson item '${{ toJSON(matrix) }}' \
            --argjson rc "$rc" \
            --argjson needs_rebuild "$needs_rebuild" \
            '$item + {rc: $rc, needs_rebuild: $needs_rebuild}' \
            > "target-status/${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: target-status-${{ strategy.job-index }}
          path: target-status/${{ strategy.job-index }}.json
          if-no-files-found: error

  prepare-build:
    name: Prepare Build Matrix
    needs: eval-targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-targets: ${{ steps.build-matrix.outputs.has_targets }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: target-status-*
          path: all-statuses
          merge-multiple: true
      - name: Preare Build Matrix
        id: build-matrix
        run: |
          set -Eeuo pipefail
          filtered="$(jq -sc '{include: [.[] | select(.needs_rebuild == true) | del(.rc, .needs_rebuild)]}' all-statuses/*.json)"
          has_targets="$(jq -r 'if (.include | length) > 0 then "true" else "false" end' <<< "$filtered")"
          echo "matrix=$filtered" >> "$GITHUB_OUTPUT"
          echo "has_targets=$has_targets" >> "$GITHUB_OUTPUT"

  build-targets:
    name: Build / ${{ matrix.target }}${{ matrix.system && format(' / {0}', matrix.system) || '' }}
    needs: prepare-build
    if: needs.prepare-build.outputs.has_targets == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare-build.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: airone01
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build Derivation
        run: nix run '.#lstr' -- build-target '${{ matrix.type }}' '${{ matrix.target }}' -- .

  no-build-failures:
    name: No Build Failures
    needs: build-targets
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.build-targets.result }}" != "success" && "${{ needs.build-targets.result }}" != "skipped" ]]; then
            echo "One or more matrix jobs failed."
            exit 1
          fi
